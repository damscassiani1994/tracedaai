[project]
name = "tracedaai"
version = "0.1.0"
description = "AI Control Center / AI Firewall for personal machines — MCP proxy, agent hooks, activity dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "psutil>=6.0",
]

[project.scripts]
tracedaai = "tracedaai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracedaai*"]
