<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TraceDaAI — AI Control Center</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131722;
    --border: #232838;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --green: #3ddc84;
    --yellow: #f5c542;
    --red: #ef4444;
    --accent: #6f9bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .lang-switch { display: flex; gap: 6px; flex-shrink: 0; padding-top: 2px; }
  .lang-btn {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer;
  }
  .lang-btn.active { color: var(--accent); border-color: var(--accent); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 480px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.target { white-space: normal; word-break: break-word; max-width: 360px; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .allow, .completed { background: rgba(61,220,132,.15); color: var(--green); }
  .ask { background: rgba(245,197,66,.15); color: var(--yellow); }
  .block, .error, .high { background: rgba(239,68,68,.15); color: var(--red); }
  .medium { background: rgba(245,197,66,.15); color: var(--yellow); }
  .low { background: rgba(61,220,132,.15); color: var(--green); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  button.approve-btn, button.deny-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; margin-right: 6px;
  }
  button.approve-btn:hover { border-color: var(--green); color: var(--green); }
  button.deny-btn:hover { border-color: var(--red); color: var(--red); }

  #summary-table tbody tr { cursor: pointer; }
  #summary-table tbody tr:hover { background: rgba(255,255,255,.04); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 100; overflow-y: auto;
    display: none;
  }
  .modal-overlay:not([hidden]) { display: flex; }
  .modal-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: 100%; max-width: 520px; padding: 20px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px;
  }
  .modal-header h2 { margin: 0; font-size: 16px; letter-spacing: .04em; text-transform: none; color: var(--text); }
  .modal-close {
    background: transparent; border: none; color: var(--muted); font-size: 18px;
    cursor: pointer; line-height: 1; padding: 4px;
  }
  .modal-close:hover { color: var(--text); }
  .modal-section { margin-bottom: 16px; }
  .modal-section h3 {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    margin: 0 0 8px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .perm-list, .warn-list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .perm-list li, .warn-list li { padding: 2px 0; }
  .perm-ok { color: var(--green); }
  .perm-warn { color: var(--yellow); }
  .perm-none { color: var(--muted); opacity: .5; }
  .res-row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
  .res-row .res-value { color: var(--muted); }
  .res-note { color: var(--muted); font-size: 11px; font-style: italic; }
  .activity-list { font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .activity-list .verb { color: var(--accent); display: inline-block; width: 5ch; }
  .warn-list li { color: var(--yellow); }
  .warn-list.none li { color: var(--muted); }
  .risk-bar-track { display: flex; gap: 2px; margin-bottom: 4px; }
  .risk-bar-seg { flex: 1; height: 10px; border-radius: 2px; background: var(--border); }
  .risk-bar-seg.filled-high { background: var(--red); }
  .risk-bar-seg.filled-medium { background: var(--yellow); }
  .risk-bar-seg.filled-low { background: var(--green); }
  .risk-label { font-size: 13px; font-weight: 600; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header-row">
      <div>
        <h1>🖥️ TraceDaAI — AI Control Center</h1>
        <div class="sub" id="hdr-sub"></div>
      </div>
      <div class="lang-switch">
        <button class="lang-btn" id="lang-en" data-lang="en">EN</button>
        <button class="lang-btn" id="lang-es" data-lang="es">ES</button>
      </div>
    </div>

    <div class="panel">
      <h2 data-i18n="agentsPanel"></h2>
      <table id="summary-table">
        <thead>
          <tr>
            <th></th>
            <th data-i18n="thAgent"></th>
            <th data-i18n="thEvents"></th>
            <th data-i18n="thBlocked"></th>
            <th data-i18n="thPending"></th>
            <th data-i18n="thRisk"></th>
            <th data-i18n="thCpu"></th>
            <th data-i18n="thRam"></th>
            <th data-i18n="thLastActivity"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="summary-empty" style="display:none;" data-i18n="summaryEmpty"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="approvalsPanel"></h2>
      <table id="approvals-table">
        <thead>
          <tr>
            <th data-i18n="thTime"></th>
            <th data-i18n="thTool"></th>
            <th data-i18n="thTarget"></th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="approvals-empty" style="display:none;" data-i18n="approvalsEmpty"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="eventsPanel"></h2>
      <table id="events-table">
        <thead>
          <tr>
            <th data-i18n="thTime"></th>
            <th data-i18n="thSource"></th>
            <th data-i18n="thAgent"></th>
            <th data-i18n="thTool"></th>
            <th data-i18n="thTarget"></th>
            <th data-i18n="thDecision"></th>
            <th data-i18n="thRisk"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="events-empty" style="display:none;" data-i18n="eventsEmpty"></div>
    </div>
  </div>

  <div class="modal-overlay" id="agent-modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="agent-modal-title">AGENT</h2>
        <button class="modal-close" id="agent-modal-close" data-i18n-aria="close">✕</button>
      </div>

      <div class="modal-section">
        <h3 data-i18n="modalPermissions"></h3>
        <ul class="perm-list" id="agent-modal-perms"></ul>
      </div>

      <div class="modal-section">
        <h3 data-i18n="modalResources"></h3>
        <div id="agent-modal-resources"></div>
      </div>

      <div class="modal-section">
        <h3 data-i18n="modalActivity"></h3>
        <div class="activity-list" id="agent-modal-activity"></div>
      </div>

      <div class="modal-section">
        <h3 data-i18n="modalWarnings"></h3>
        <ul class="warn-list" id="agent-modal-warnings"></ul>
      </div>

      <div class="modal-section" style="margin-bottom:0;">
        <h3 data-i18n="modalRisk"></h3>
        <div class="risk-bar-track" id="agent-modal-risk-bar"></div>
        <div class="risk-label" id="agent-modal-risk-label"></div>
      </div>
    </div>
  </div>

<script>
const RISK_ORDER = { high: 3, medium: 2, low: 1 };

const I18N = {
  en: {
    subtitle: "Phase 1 · MCP Firewall + Claude Code hooks · refreshes every 3s",
    agentsPanel: "Agents",
    thAgent: "Agent", thEvents: "Events", thBlocked: "Blocked", thPending: "Pending (ask)",
    thRisk: "Risk", thCpu: "CPU", thRam: "RAM", thLastActivity: "Last activity",
    summaryEmpty: "No activity recorded yet. Set up the MCP proxy or the Claude Code hooks to start seeing events.",
    approvalsPanel: "Pending approvals",
    thTime: "Time", thTool: "Tool", thTarget: "Target",
    approveBtn: "Approve", denyBtn: "Deny",
    approvalsEmpty: "No pending approvals.",
    eventsPanel: "Recent activity",
    thSource: "Source", thDecision: "Decision",
    eventsEmpty: "No events yet.",
    close: "Close",
    modalPermissions: "Permissions", modalResources: "Resources", modalActivity: "Activity",
    modalWarnings: "Warnings", modalRisk: "Risk",
    permRead: "Read files", permWrite: "Write files", permExec: "Execute commands",
    permGit: "Git access", permNet: "Internet access", permEnv: "Environment variable access",
    resCpu: "CPU", resRam: "RAM", resGpu: "GPU", resNet: "Network ↓ / ↑",
    notMeasured: "N/A (not measured yet)", phase3Note: "N/A (roadmap Phase 3)",
    noActivity: "No activity recorded.", noWarnings: "No warnings.",
    warnBlocked: "Blocked", warnPending: "Pending",
    riskLow: "LOW", riskMedium: "MEDIUM", riskHigh: "HIGH",
    decisionAllow: "allow", decisionAsk: "ask", decisionBlock: "block",
    decisionCompleted: "completed", decisionError: "error",
  },
  es: {
    subtitle: "Fase 1 · MCP Firewall + hooks de Claude Code · actualiza cada 3s",
    agentsPanel: "Agentes",
    thAgent: "Agente", thEvents: "Eventos", thBlocked: "Bloqueados", thPending: "Pendientes (ask)",
    thRisk: "Riesgo", thCpu: "CPU", thRam: "RAM", thLastActivity: "Última actividad",
    summaryEmpty: "Sin actividad registrada todavía. Configura el proxy MCP o los hooks de Claude Code para empezar a ver eventos.",
    approvalsPanel: "Aprobaciones pendientes",
    thTime: "Hora", thTool: "Herramienta", thTarget: "Objetivo",
    approveBtn: "Aprobar", denyBtn: "Denegar",
    approvalsEmpty: "No hay aprobaciones pendientes.",
    eventsPanel: "Actividad reciente",
    thSource: "Origen", thDecision: "Decisión",
    eventsEmpty: "Sin eventos todavía.",
    close: "Cerrar",
    modalPermissions: "Permisos", modalResources: "Recursos", modalActivity: "Actividad",
    modalWarnings: "Advertencias", modalRisk: "Riesgo",
    permRead: "Leer archivos", permWrite: "Escribir archivos", permExec: "Ejecutar comandos",
    permGit: "Acceso a Git", permNet: "Acceso a Internet", permEnv: "Acceso a variables de entorno",
    resCpu: "CPU", resRam: "RAM", resGpu: "GPU", resNet: "Red ↓ / ↑",
    notMeasured: "N/D (no medido aún)", phase3Note: "N/D (Fase 3 del roadmap)",
    noActivity: "Sin actividad registrada.", noWarnings: "Sin advertencias.",
    warnBlocked: "Bloqueado", warnPending: "Pendiente",
    riskLow: "BAJO", riskMedium: "MEDIO", riskHigh: "ALTO",
    decisionAllow: "permitido", decisionAsk: "preguntar", decisionBlock: "bloqueado",
    decisionCompleted: "completado", decisionError: "error",
  },
};

// Heuristic mapping from observed tool_name/target text to a human capability
// label. Inferred from what this agent has actually done, not assumed.
const PERMISSION_RULES = [
  { key: "read", labelKey: "permRead", match: e => /read|grep|glob/i.test(e.tool_name || "") },
  { key: "write", labelKey: "permWrite", match: e => /write|edit/i.test(e.tool_name || "") },
  { key: "exec", labelKey: "permExec", match: e => /bash|exec|shell|command/i.test(e.tool_name || "") },
  { key: "git", labelKey: "permGit", match: e => /git\s/i.test(e.target || "") || /git/i.test(e.tool_name || "") },
  { key: "net", labelKey: "permNet", match: e => /fetch|web|http/i.test(e.tool_name || "") || /https?:\/\//i.test(e.target || "") },
  { key: "env", labelKey: "permEnv", warn: true,
    match: e => /\.env|\.aws\/credentials|id_rsa|id_ed25519|\.ssh\//i.test(e.target || "") },
];

const RISK_LABEL_KEYS = { high: "riskHigh", medium: "riskMedium", low: "riskLow" };
const DECISION_LABEL_KEYS = {
  allow: "decisionAllow", ask: "decisionAsk", block: "decisionBlock",
  completed: "decisionCompleted", error: "decisionError",
};

let currentLang = "en";
try {
  const saved = localStorage.getItem("tracedaai_lang");
  if (saved === "en" || saved === "es") currentLang = saved;
} catch (e) { /* localStorage unavailable, default to English */ }

function t(key) {
  return I18N[currentLang][key] || key;
}
function riskText(riskKey) {
  return t(RISK_LABEL_KEYS[riskKey] || riskKey);
}
function decisionText(decisionKey) {
  return t(DECISION_LABEL_KEYS[decisionKey] || decisionKey);
}

function applyStaticI18n() {
  document.documentElement.lang = currentLang;
  document.getElementById("hdr-sub").textContent = t("subtitle");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    el.setAttribute("aria-label", t(el.dataset.i18nAria));
  });
  document.getElementById("lang-en").classList.toggle("active", currentLang === "en");
  document.getElementById("lang-es").classList.toggle("active", currentLang === "es");
}

function setLang(lang) {
  currentLang = lang;
  try { localStorage.setItem("tracedaai_lang", lang); } catch (e) { /* ignore */ }
  applyStaticI18n();
  refreshAll();
  if (openModalState) {
    openAgentDetail(openModalState.agent, openModalState.riskLabel, openModalState.riskScore);
  }
}

document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
document.getElementById("lang-es").addEventListener("click", () => setLang("es"));

function fmtTime(ts) {
  return new Date(ts * 1000).toLocaleTimeString();
}
function fmtBytes(b) {
  if (!b) return "-";
  const mb = b / (1024 * 1024);
  return mb >= 1024 ? (mb / 1024).toFixed(1) + " GB" : mb.toFixed(0) + " MB";
}
function badge(text, cls) {
  return `<span class="badge ${cls}">${text || "-"}</span>`;
}

let latestProcesses = [];
let openModalState = null;

async function refreshSummary() {
  const [summary, processes] = await Promise.all([
    fetch('/api/summary').then(r => r.json()),
    fetch('/api/processes').then(r => r.json()),
  ]);
  latestProcesses = processes;
  const procByAgent = {};
  for (const p of processes) {
    if (!procByAgent[p.agent]) procByAgent[p.agent] = { cpu: 0, rss: 0 };
    procByAgent[p.agent].cpu += p.cpu_percent || 0;
    procByAgent[p.agent].rss += p.rss_bytes || 0;
  }
  const tbody = document.querySelector('#summary-table tbody');
  tbody.innerHTML = '';
  document.getElementById('summary-empty').style.display = summary.length ? 'none' : 'block';
  for (const row of summary) {
    const proc = procByAgent[row.agent];
    const active = proc !== undefined;
    const riskLabel = row.risk_score >= 3 ? 'high' : row.risk_score === 2 ? 'medium' : 'low';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="dot ${active ? 'on' : 'off'}"></span></td>
      <td>${row.agent}</td>
      <td>${row.total_events}</td>
      <td>${row.blocked || 0}</td>
      <td>${row.asked || 0}</td>
      <td>${badge(riskText(riskLabel), riskLabel)}</td>
      <td>${proc ? proc.cpu.toFixed(0) + '%' : '-'}</td>
      <td>${proc ? fmtBytes(proc.rss) : '-'}</td>
      <td>${fmtTime(row.last_seen)}</td>
    `;
    tr.addEventListener('click', () => openAgentDetail(row.agent, riskLabel, row.risk_score));
    tbody.appendChild(tr);
  }
}

async function refreshApprovals() {
  const approvals = await fetch('/api/approvals').then(r => r.json());
  const tbody = document.querySelector('#approvals-table tbody');
  tbody.innerHTML = '';
  document.getElementById('approvals-empty').style.display = approvals.length ? 'none' : 'block';
  for (const a of approvals) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${fmtTime(a.ts)}</td>
      <td>${a.tool_name || '-'}</td>
      <td class="target">${a.target || '-'}</td>
      <td>
        <button class="approve-btn" data-id="${a.id}" data-action="approve">${t('approveBtn')}</button>
        <button class="deny-btn" data-id="${a.id}" data-action="deny">${t('denyBtn')}</button>
      </td>
    `;
    tbody.appendChild(tr);
  }
  tbody.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', async () => {
      await fetch(`/api/approvals/${btn.dataset.id}/${btn.dataset.action}`, { method: 'POST' });
      refreshApprovals();
    });
  });
}

async function refreshEvents() {
  const events = await fetch('/api/events?limit=100').then(r => r.json());
  const tbody = document.querySelector('#events-table tbody');
  tbody.innerHTML = '';
  document.getElementById('events-empty').style.display = events.length ? 'none' : 'block';
  for (const e of events) {
    if (e.event_type === 'protocol') continue;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${fmtTime(e.ts)}</td>
      <td>${e.source}</td>
      <td>${e.agent || '-'}</td>
      <td>${e.tool_name || '-'}</td>
      <td class="target">${e.target || '-'}</td>
      <td>${badge(decisionText(e.decision), e.decision)}</td>
      <td>${badge(riskText(e.risk), e.risk)}</td>
    `;
    tbody.appendChild(tr);
  }
}

function verbFor(e) {
  if (e.event_type === 'tool_result') return e.decision === 'error' ? 'ERR' : 'DONE';
  if (/read|grep|glob/i.test(e.tool_name || '')) return 'READ';
  if (/write|edit/i.test(e.tool_name || '')) return 'WRITE';
  if (/bash|exec|shell|command/i.test(e.tool_name || '')) return 'EXEC';
  if (/fetch|web|http/i.test(e.tool_name || '')) return 'HTTP';
  return (e.tool_name || '?').slice(0, 6).toUpperCase();
}

async function openAgentDetail(agent, riskLabel, riskScore) {
  openModalState = { agent, riskLabel, riskScore };

  // Pull a larger, agent-specific slice so capability/warning detection isn't
  // limited by the 100-row window the main activity table shows.
  const allEvents = await fetch('/api/events?limit=500').then(r => r.json());
  const events = allEvents.filter(e => e.agent === agent && e.event_type !== 'protocol');

  document.getElementById('agent-modal-title').textContent = agent.toUpperCase();

  const permsEl = document.getElementById('agent-modal-perms');
  permsEl.innerHTML = PERMISSION_RULES.map(rule => {
    const label = t(rule.labelKey);
    const seen = events.some(rule.match);
    if (!seen) return `<li class="perm-none">–&nbsp;&nbsp;${label}</li>`;
    if (rule.warn) return `<li class="perm-warn">⚠&nbsp;&nbsp;${label}</li>`;
    return `<li class="perm-ok">✓&nbsp;&nbsp;${label}</li>`;
  }).join('');

  const procs = latestProcesses.filter(p => p.agent === agent);
  const cpu = procs.reduce((s, p) => s + (p.cpu_percent || 0), 0);
  const rss = procs.reduce((s, p) => s + (p.rss_bytes || 0), 0);
  document.getElementById('agent-modal-resources').innerHTML = `
    <div class="res-row"><span>${t('resCpu')}</span><span class="res-value">${procs.length ? cpu.toFixed(0) + '%' : '–'}</span></div>
    <div class="res-row"><span>${t('resRam')}</span><span class="res-value">${procs.length ? fmtBytes(rss) : '–'}</span></div>
    <div class="res-row"><span>${t('resGpu')}</span><span class="res-value res-note">${t('notMeasured')}</span></div>
    <div class="res-row"><span>${t('resNet')}</span><span class="res-value res-note">${t('phase3Note')}</span></div>
  `;

  const recent = events.slice(0, 10);
  document.getElementById('agent-modal-activity').innerHTML = recent.length
    ? recent.map(e => `${fmtTime(e.ts)}  <span class="verb">${verbFor(e)}</span>  ${e.target || e.tool_name || ''}`).join('\n')
    : `<span class="res-note">${t('noActivity')}</span>`;

  const warnEvents = events.filter(e => e.decision === 'block' || e.decision === 'ask');
  const seenReasons = new Set();
  const warnings = [];
  for (const e of warnEvents) {
    const reason = e.reason || `${e.decision === 'block' ? t('warnBlocked') : t('warnPending')}: ${e.tool_name || ''}`;
    if (seenReasons.has(reason)) continue;
    seenReasons.add(reason);
    warnings.push(reason);
    if (warnings.length >= 5) break;
  }
  const warnListEl = document.getElementById('agent-modal-warnings');
  warnListEl.className = warnings.length ? 'warn-list' : 'warn-list none';
  warnListEl.innerHTML = warnings.length
    ? warnings.map(w => `<li>• ${w}</li>`).join('')
    : `<li>${t('noWarnings')}</li>`;

  const filled = riskScore >= 3 ? 8 : riskScore === 2 ? 5 : 2;
  const fillClass = `filled-${riskLabel}`;
  const track = document.getElementById('agent-modal-risk-bar');
  track.innerHTML = Array.from({ length: 10 }, (_, i) =>
    `<div class="risk-bar-seg ${i < filled ? fillClass : ''}"></div>`
  ).join('');
  document.getElementById('agent-modal-risk-label').textContent = riskText(riskLabel);
  document.getElementById('agent-modal-risk-label').className = `risk-label ${riskLabel}`;

  document.getElementById('agent-modal').hidden = false;
}

function closeAgentDetail() {
  document.getElementById('agent-modal').hidden = true;
  openModalState = null;
}

document.getElementById('agent-modal-close').addEventListener('click', closeAgentDetail);
document.getElementById('agent-modal').addEventListener('click', (ev) => {
  if (ev.target.id === 'agent-modal') closeAgentDetail();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closeAgentDetail();
});

async function refreshAll() {
  try {
    await Promise.all([refreshSummary(), refreshApprovals(), refreshEvents()]);
  } catch (e) {
    console.error(e);
  }
}

applyStaticI18n();
refreshAll();
setInterval(refreshAll, 3000);
</script>
</body>
